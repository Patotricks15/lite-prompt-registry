[package]
name = "lite-prompt-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Fast in-memory prompt version governance"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
